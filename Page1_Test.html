<html>
<head>
	<link id="modeSheet" rel="stylesheet" href="light_mode.css">
    <link id="fontStyle" rel="stylesheet" href="Arial.css">
<style>
body {
		display: grid;
		grid-template-columns: auto;
		grid-template-rows: auto auto auto auto;
		padding: 10px;
		gap: 10px;
		}
.settings_bar {
        display: grid;
		grid-template-columns: 1fr 1fr;
        justify-content: center;
        align-items: center;
        padding: 10px;
        gap: 10px;
        } 
.pictures {
		display: grid;
		justify-content: center;
        align-items: center;
		gap: 10px;
		}
.navigation {
		display: flex;
		justify-content: space-between;
		width: auto;
		}
</style>
</head>
<body onpageshow="settings()">
	<div class = "settings_bar">
		<!-- mode toggle button -->
		<button onclick="darkMode()">Dark Mode</button>

		<!--dropdown for font -->
		<div class="fontdrop">
			<button onclick="fontdrop()" class="dropbtn">Font</button>
			<div id="fontDropdown" class="dropdown-content">
				<!--javascript:void(0); makes the webpage not change -->
				<a href="javascript:void(0);" onclick="changeFont('arial')">Arial</a>
				<a href="javascript:void(0);" onclick="changeFont('comicSans')">Comic Sans</a>
			</div>
	</div>
	<div class = "pictures">
		<div>
			<img src="placeholder.png" alt="Witch's House">
		</div>
		<div>
			<img src="placeholder.png" alt="Forest">
		</div>
	</div>
	<div>
		<p> Story...</p>
	</div>
	<div class = "navigation">
		<button onclick="home()">Home</button>
		<button onclick="next()">Next</button>
	</div>
	
	<script>
    /* onload stuff */
    function settings() {
        // Apply dark mode preference
        if (localStorage.getItem("mode") == 1) {
            document.getElementById("modeSheet").href = "dark_mode.css";
        } else {
            document.getElementById("modeSheet").href = "light_mode.css";
        }

        // Apply font preferences
        if (localStorage.getItem("font") == 'arial'){
            document.getElementById("fontStyle").href = "Arial.css";}
        if (localStorage.getItem("font") == 'comicSans'){
            document.getElementById("fontStyle").href = "ComicSans.css";}
    }

	/* button press function */
    function darkMode() {
        /* dark mode */
        if (document.getElementById("modeSheet").getAttribute("href") == "light_mode.css") {
			document.getElementById("modeSheet").href = "dark_mode.css";
            localStorage.setItem("mode", 1);
        } 
        /* light mode */
        else {
            document.getElementById("modeSheet").href = "light_mode.css";
            localStorage.setItem("mode", 0);
        }
    }

    /* font buttons */
        function changeFont(font) {
			if (font == 'arial') {
				document.getElementById("fontStyle").href = "Arial.css";
				localStorage.setItem("font",'arial')}
			if (font == 'comicSans') {
				document.getElementById("fontStyle").href = "ComicSans.css";
				localStorage.setItem("font",'comicSans')}
        }
        

    /* Font Dropdown menu */
	function fontdrop() {
		document.getElementById("fontDropdown").classList.toggle("show");
	}

	// Close the dropdown menu if the user clicks outside of it
	window.onclick = function(event) {
		if (!event.target.matches('.dropbtn')) {
			var dropdowns = document.getElementsByClassName("dropdown-content");
			var i;
			for (i = 0; i < dropdowns.length; i++) {
				var openDropdown = dropdowns[i];
				if (openDropdown.classList.contains('show')) {
					openDropdown.classList.remove('show');
				}
			}
		}
	}
</script>
</body>
</html>
