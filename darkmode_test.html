<!DOCTYPE html>
<html>
<head>
    <link id="modeSheet" rel="stylesheet" href="light_mode.css">
</head>
<body onpageshow="settings()">

<h1>Testing the dark mode concept can then expand to other accessibility features</h1>

  <!-- mode toggle button -->
<button onclick="darkMode()">Dark Mode</button>

<!--dropdown for font -->
<div class="fontdrop">
  <button onclick="fontdrop()" class="dropbtn">Dropdown</button>
  <div id="fontDropdown" class="dropdown-content">
    <a href="#">Link 1</a>
    <a href="#">Link 2</a>
    <a href="#">Link 3</a>
  </div>
</div>

<script>
    /* onload stuff */
    function settings() {
        // Apply dark mode preference
        if (localStorage.getItem("mode") == 1) {
            document.getElementById("modeSheet").href = "dark_mode.css";
        } else {
            document.getElementById("modeSheet").href = "light_mode.css";
        }
    }

  /* button press function */
    function darkMode() {
        /* dark mode */
        /* needed to use chatgpt to help fix, the suggested change was only changing 
        if (document.getElementById("modeSheet").href= "light_mode.css") {
            document.getElementById("modeSheet").href = "dark_mode.css";
            localStorage.setItem("mode", 1);
        } 
        to what is bellow as the href of the style sheet could contain the whole path instead of what we want to compare it to, which is the name of the file */
        if (document.getElementById("modeSheet").getAttribute("href") == "light_mode.css") {
            document.getElementById("modeSheet").href = "dark_mode.css";
            localStorage.setItem("mode", 1);
        } 
        /* light mode */
        else {
            document.getElementById("modeSheet").href = "light_mode.css";
            localStorage.setItem("mode", 0);
        }
    }

    /* Font Dropdown menu */
function fontdrop() {
  document.getElementById("fontDropdown").classList.toggle("show");
}

// Close the dropdown menu if the user clicks outside of it
window.onclick = function(event) {
  if (!event.target.matches('.dropbtn')) {
    var dropdowns = document.getElementsByClassName("dropdown-content");
    var i;
    for (i = 0; i < dropdowns.length; i++) {
      var openDropdown = dropdowns[i];
      if (openDropdown.classList.contains('show')) {
        openDropdown.classList.remove('show');
      }
    }
  }
}
</script>
</body>
</html>
